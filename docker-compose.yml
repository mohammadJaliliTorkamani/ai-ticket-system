name: ticketifier-dev
services:
  api:
    build: .
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./app:/app/app:ro"]
  web:
    build:
      context: web
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: { condition: service_healthy }
